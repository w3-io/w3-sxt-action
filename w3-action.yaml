kind: integration
partner: sxt
name: Space and Time
version: 1.0.0
repo: w3-io/w3-sxt-action
description: >
  Space and Time decentralized SQL database with tamper-proof query
  execution. DDL, DML, DQL, and REST discovery against indexed
  blockchain data (Ethereum, Bitcoin, Base) and custom tables.
context: >
  Use SxT when the workflow needs SQL queries against blockchain
  data or needs to store/retrieve structured data with
  cryptographic tamper-proofing. For real-time price feeds, use
  Pyth or Chainlink instead. Login mode (userId + password +
  biscuit) for full DDL/DML access; api-key mode for read-only
  indexed chain data. Discovery endpoints are on
  api.makeinfinite.dev (v2 API). Typical: discover-tables → query
  → execute.
commands:
  - name: query
    description: >
      Execute a SELECT query. Returns result rows as JSON. Supports
      indexed blockchain data (Ethereum, Bitcoin, Base) and custom tables.
    inputs:
      sql:
        type: string
        required: true
        description: SQL SELECT statement
      resources:
        type: string
        required: false
        description: Comma-separated table references for performance optimization
      query-type:
        type: string
        required: false
        description: 'OLTP or OLAP (default: OLTP)'
    outputs:
      result:
        type: array
        description: Array of result row objects

  - name: execute
    description: >
      Execute DML (INSERT, UPDATE, DELETE). Returns affected row count.
    inputs:
      sql:
        type: string
        required: true
        description: SQL DML statement
      resources:
        type: string
        required: false
        description: Comma-separated table references
    outputs:
      result:
        type: array
        description: '[{UPDATED: <count>}]'

  - name: ddl
    description: >
      Execute DDL (CREATE TABLE, DROP TABLE, ALTER). Manages schema
      and table lifecycle.
    inputs:
      sql:
        type: string
        required: true
        description: SQL DDL statement
    outputs:
      result:
        type: object
        description: '{success: true}'

  - name: discover-schemas
    description: >
      List all schemas visible to the caller via the Discovery API.
    inputs: {}
    outputs:
      result:
        type: array
        description: Schema metadata

  - name: discover-tables
    description: >
      List tables in a schema via the Discovery API. Defaults to
      schema-name if schema input is not provided.
    inputs:
      schema:
        type: string
        required: false
        description: Schema name (defaults to schema-name)
    outputs:
      result:
        type: array
        description: Table metadata

  - name: discover-columns
    description: >
      List columns for a table via the Discovery API.
    inputs:
      schema:
        type: string
        required: false
        description: Schema name (defaults to schema-name)
      table:
        type: string
        required: true
        description: Table name
    outputs:
      result:
        type: array
        description: Column metadata

  - name: discover-primary-keys
    description: >
      List primary-key columns for a table via the Discovery API.
    inputs:
      schema:
        type: string
        required: false
        description: Schema name (defaults to schema-name)
      table:
        type: string
        required: true
        description: Table name
    outputs:
      result:
        type: array
        description: Primary key metadata

  - name: discover-indexes
    description: >
      List indexes for a table via the Discovery API.
    inputs:
      schema:
        type: string
        required: false
        description: Schema name (defaults to schema-name)
      table:
        type: string
        required: true
        description: Table name
    outputs:
      result:
        type: array
        description: Index metadata

  - name: discover-relationships
    description: >
      List foreign-key relationships for a table via the Discovery API.
    inputs:
      schema:
        type: string
        required: false
        description: Schema name (defaults to schema-name)
      table:
        type: string
        required: true
        description: Table name
    outputs:
      result:
        type: array
        description: Relationship/foreign-key metadata

  - name: list-chains
    description: >
      Query latest blocks from an indexed blockchain. Verifies
      connectivity and data availability.
    inputs:
      chain:
        type: string
        required: false
        description: 'Chain name (default: ETHEREUM). Also supports BITCOIN, BASE.'
    outputs:
      result:
        type: array
        description: Latest blocks from the specified chain

  # ---------------------------------------------------------------------------
  # State entity commands (w3-give Story 1.1). Append-only versioned entities
  # in <schema-name>.ENTITY_VERSIONS. Auth via the explicit-JWT inputs
  # (auth-url / auth-secret / biscuit); the runtime biscuit grants dql_select +
  # dml_insert ONLY, so history cannot be mutated. transaction and the
  # object-store ops are intentionally absent — they raise NOT_SUPPORTED
  # (object storage is the cloud: syscall / Storj, Story 1.2). Outputs are a
  # JSON string on `result`, parsed by callers via
  # fromJSON(steps.X.outputs.result).<field>; failures set `error-code`.
  # ---------------------------------------------------------------------------
  - name: put-entity
    description: >
      Append a new version row for an entity (append-only). Reads the current
      latest, merges the incoming partial fields onto it, enforces optional
      expected-version CAS, then INSERTs a new monotonic version. A replay
      appends a NEW version (not a storage no-op).
    inputs:
      tenant-id:
        type: string
        required: true
        description: Tenant scope, bound on every write (multi-tenant isolation)
      entity-type:
        type: string
        required: true
        description: 'Entity type, e.g. Gift | User | Recipient | Asset'
      id:
        type: string
        required: true
        description: Entity id (unique within tenant + entity-type)
      fields:
        type: string
        required: true
        description: JSON object — full entity, or a partial patch merged onto the latest
      expected-version:
        type: string
        required: false
        description: Optimistic-concurrency token; stale → PRECONDITION_FAILED
    outputs:
      result:
        type: object
        description: '{ entity, version } — the persisted entity and its new version'

  - name: get-entity
    description: >
      Read the latest version of an entity by id, tenant-scoped. Not-found is
      not an error — returns { entity: null }.
    inputs:
      tenant-id:
        type: string
        required: true
        description: Tenant scope
      entity-type:
        type: string
        required: true
        description: Entity type
      id:
        type: string
        required: true
        description: Entity id
    outputs:
      result:
        type: object
        description: '{ entity, version } or { entity: null }'

  - name: query-entities
    description: >
      PostgREST-style filter/sort/limit over the latest-version view,
      tenant-scoped. The latest version per id is selected in SQL; filter/sort/
      limit are applied over the result (SxT has no JSON column functions).
    inputs:
      tenant-id:
        type: string
        required: true
        description: Tenant scope
      entity-type:
        type: string
        required: true
        description: Entity type
      filter:
        type: string
        required: false
        description: >
          JSON object of field → operator, e.g.
          {"status":{"eq":"completed"},"amount":{"gt":100}}. Operators:
          eq, neq, in, like, contains, gt, gte, lt, lte, is_null.
      sort:
        type: string
        required: false
        description: 'JSON array of {field, direction}, most-significant first (direction: asc|desc)'
      limit:
        type: string
        required: false
        description: 'Max rows (default 50, capped at 500)'
    outputs:
      result:
        type: array
        description: Latest version per id, filtered/sorted/limited
